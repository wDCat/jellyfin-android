# Gradle
org.gradle.jvmargs=-Xmx2048m

# Cronet embedded/common/api share the org.chromium.net namespace.
android.uniquePackageNames=false

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Upstream base version and fork release number (overridden by JELLYFIN_VERSION in CI).
jellyfin.version=2.7.3-6
