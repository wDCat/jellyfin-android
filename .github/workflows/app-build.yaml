name: App / Build

on:
  push:
    tags:
      - 'v*'

env:
  JELLYFIN_VERSION: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Assemble all APKs
        run: ./gradlew assemble --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
      - name: Sign libre release APK
        id: sign-libre
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # tag=v1
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/libre/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Sign proprietary release APK
        id: sign-proprietary
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # tag=v1
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/proprietary/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Collect signed release APKs
        run: |
          mkdir -p build/signed-release
          mv ${{ steps.sign-libre.outputs.signedReleaseFile }} build/signed-release/
          mv ${{ steps.sign-proprietary.outputs.signedReleaseFile }} build/signed-release/
      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apks
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/*/debug/*.apk
      - name: Upload signed release APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apks
          retention-days: 30
          if-no-files-found: error
          path: build/signed-release/*.apk
